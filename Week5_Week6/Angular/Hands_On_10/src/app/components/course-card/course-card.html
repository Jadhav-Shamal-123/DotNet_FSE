<div class="course-card">

  <h3>{{ course.name }}</h3>

  <p>
    <strong>Code:</strong>
    {{ course.code }}
  </p>

  <p>
    <strong>Credits:</strong>
    {{ course.credits }}
  </p>

  <p>
    <strong>Status:</strong>
    {{ course.gradeStatus }}
  </p>

  <button
    type="button"
    (click)="toggleEnrollment()">

    Enroll

  </button>

  <button
    type="button"
    (click)="viewDetails()">

    View Details

  </button>

</div>
